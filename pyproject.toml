[project]
name = "django-rest-envelope"
version = "1.2.0"
description = "A mixin for Django REST package List Views to return an object instead of a list."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Ferran Jovell", email = "ferran.jovell+gh@gmail.com" },
]
keywords = [
    "django",
]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Environment :: Web Environment",
    "Framework :: Django",
]
dependencies = [
    "Django>=4.2",
    "djangorestframework>=3.11.0",
]

[project.license]
file = "LICENSE"

[project.urls]
homepage = "https://github.com/mrswats/django-rest-envelope"
"Bug Tracker" = "https://github.com/mrswats/django-rest-envelope/issues"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-django",
]

[build-system]
requires = [
    "setuptools>=75.1",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "rest_envelope",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"

[tool.black]
line-length = 99
target_version = [
    "py39",
]
skip-string-normalization = false
include = "\\.pyi?$"
exclude = "(\n  /(\n      \\.eggs         # exclude a few common directories in the\n    | \\.git          # root of the project\n    | \\.hg\n    | \\.mypy_cache\n    | \\.tox\n    | \\.venv\n    | _build\n    | buck-out\n    | build\n    | dist\n  )/\n)\n"
